name: Benchmark
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/benchmark.yml
      - benchmark/**
      - bun.lock
      - bunfig.toml
      - oxlint.config.ts
      - oxfmt.config.ts
      - package.json
      - packages/cli/**
      - packages/typescript-config/**
      - scripts/**
      - tsconfig.json
      - turbo.json

# Only the latest commit on a PR needs benchmarking.
concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (full history for the base ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: Install Bun
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Compare tsrs with the compiler it replaces, on the same PR sources and
      # runner. Both compiler packages are installed with the workspace.
      - name: Benchmark tsgo against tsrs
        id: typecheck-benchmark
        env:
          TYPECHECK_WARMUPS: "1"
          TYPECHECK_SAMPLES: "5"
        run: bun ./benchmark/typecheck.ts

      - name: Upload type-check benchmark report
        if: always() && steps.typecheck-benchmark.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-benchmark
          path: |
            benchmark/results/typecheck.html
            benchmark/results/typecheck.json
          if-no-files-found: ignore

      # Build + pack the PR (head) build under test. This follows the compiler
      # report so type-check benchmark failures still leave an artifact.
      - name: Build and pack head
        run: |
          bun run build --filter ultracite
          cd packages/cli
          npm pack --loglevel=error
          mv ultracite-*.tgz "$GITHUB_WORKSPACE/head.tgz"

      # Build + pack the PR's base (main) build in a worktree, on the same
      # runner, so the comparison cancels out machine speed.
      - name: Build and pack base
        run: |
          git worktree add /tmp/ultracite-base ${{ github.event.pull_request.base.sha }}
          cd /tmp/ultracite-base
          bun install
          bun run build --filter ultracite
          cd packages/cli
          npm pack --loglevel=error
          mv ultracite-*.tgz "$GITHUB_WORKSPACE/base.tgz"

      # Interleaved head-vs-base benchmark. Fails the job on a statistically
      # significant regression (see benchmark/README.md for the gate).
      - name: Run benchmark
        run: bun ./benchmark/index.ts --base base.tgz --head head.tgz
